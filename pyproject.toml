[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepilot"
version = "0.1.0"
description = "LangGraph-based autonomous trading research and paper-trading agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<1.0",
  "langchain-core>=0.3,<1.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
tradepilot = "tradepilot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
